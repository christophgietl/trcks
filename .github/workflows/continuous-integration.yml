name: CI

on:
  - push

permissions: { }

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed by build-backend to derive package version from Git tags
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
        with:
          install-and-cache-dependencies: true
      - run: uv run --no-sync mkdocs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed by build-backend to derive package version from Git tags
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
      - run: uv build
      - name: Check that library skill is included in sdist and wheel
        shell: python
        run: |
          import tarfile
          import zipfile
          from pathlib import Path

          def check_archive_content(pattern, expected_files):
              archive = find_file(pattern)
              files = get_content(archive)
              for expected_file in expected_files:
                  if expected_file not in files:
                      fail(f"{expected_file} is missing from {archive}.")

          def fail(message):
              print(f"::error::{message}")
              raise SystemExit(1)

          def find_file(pattern):
              files = list(Path.cwd().glob(pattern))
              if len(files) != 1:
                  fail(f"Expected exactly one {pattern}, found {len(files)}.")
              return files[0]

          def get_content(archive):
              if tarfile.is_tarfile(archive):
                  with tarfile.open(archive) as tf:
                      return {name.partition("/")[2] for name in tf.getnames()}
              with zipfile.ZipFile(archive) as zf:
                  return set(zf.namelist())

          check_archive_content("dist/*.tar.gz", ("pdm_build.py", "skills/trcks/SKILL.md"))
          check_archive_content("dist/*.whl", ("trcks/.agents/skills/trcks/SKILL.md",))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-files
          path: |
            dist/
            pyproject.toml
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed by build-backend to derive package version from Git tags
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
        with:
          install-and-cache-dependencies: true
          python-version: ${{ matrix.python-version }}
      - uses: christophgietl/uv-actions/set-up-pre-commit@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
        with:
          cache-key-suffix: ${{ matrix.os }}-${{ matrix.python-version }}
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Run tests and type checks with dependencies specified in uv.lock file
        uses: ./.github/actions/run-tests-and-type-checks
      - name: Run tests and type checks with lowest direct dependencies
        uses: ./.github/actions/run-tests-and-type-checks
        with:
          locked: false
          resolution-strategy: lowest-direct
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref_type == 'tag'
    needs:
      - build-docs
      - build-package
      - lint-and-test
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
  publish-package:
    environment:
      name: PyPI
      url: https://pypi.org/project/trcks/
    if: github.ref_type == 'tag'
    needs:
      - publish-docs
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed by build-backend to derive package version from Git tags
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: package-files
      - uses: christophgietl/uv-actions/set-up-uv@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
      - run: uv publish
