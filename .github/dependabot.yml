version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directories:
      - /
      - /.github/actions/*/
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: daily
      time: "00:41"
      timezone: Europe/Berlin
  - package-ecosystem: pre-commit
    cooldown:
      default-days: 7
    directory: /
    groups:
      pre-commit:
        patterns:
          - "*"
    schedule:
      day: saturday
      interval: weekly
      time: "00:41"
      timezone: Europe/Berlin
  - package-ecosystem: uv
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    directory: /
    groups:
      uv-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: skills-ref
    schedule:
      interval: daily
      time: "00:41"
      timezone: Europe/Berlin
